<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availability – SmartCare AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="toast-container"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="dash-layout">

  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar-brand"><div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>SmartCare <span>AI</span></a>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/doctor/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a class="nav-item" href="/doctor/appointments"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
      <a class="nav-item" href="/doctor/patients"><i class="fa-solid fa-users"></i> My Patients</a>
      <a class="nav-item" href="/doctor/prescription"><i class="fa-solid fa-file-prescription"></i> Prescriptions</a>
      <a class="nav-item active" href="/doctor/availability"><i class="fa-solid fa-clock"></i> Availability</a>
      <a class="nav-item" href="/doctor/profile"><i class="fa-solid fa-circle-user"></i> Profile</a>
      <a class="nav-item logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar"><span id="sidebarUserInit">?</span></div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarUserName">Loading…</div>
        <div class="sidebar-user-role" id="sidebarUserRole">doctor</div>
      </div>
    </div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>
        <h1>Manage Availability</h1>
      </div>
      <div class="topbar-actions"><div class="topbar-avatar" id="topbarAvatar">?</div></div>
    </header>

    <div class="dash-content">
      <div style="display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;">
        <!-- Current availability -->
        <div>
          <div class="page-header">
            <h2>Current Schedule</h2>
            <p>Your availability visible to patients for booking appointments.</p>
          </div>
          <div id="availabilityList">
            <div class="loading-overlay"><div class="spinner spinner-dark"></div></div>
          </div>
        </div>

        <!-- Add availability -->
        <div class="card">
          <div class="card-header"><h3><i class="fa-solid fa-plus" style="color:var(--primary);"></i> Add / Update Day</h3></div>
          <div class="card-body">
            <div id="availAlert"></div>
            <div class="form-group">
              <label class="form-label">Day of Week</label>
              <select id="availDay" class="form-control">
                <option value="">Select day</option>
                <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Add Time Slot</label>
              <div style="display:flex;gap:8px;">
                <input type="time" id="slotInput" class="form-control" />
                <button class="btn btn-outline btn-sm" onclick="addSlot()"><i class="fa-solid fa-plus"></i></button>
              </div>
              <span class="form-hint">Slots will be shown in AM/PM format to patients.</span>
            </div>

            <div id="pendingSlots" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:32px;"></div>

            <!-- Quick add presets -->
            <div style="margin-bottom:14px;">
              <p style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:6px;">Quick Presets:</p>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                <button class="btn btn-secondary btn-sm" onclick="addPreset('morning')">Morning (9–12)</button>
                <button class="btn btn-secondary btn-sm" onclick="addPreset('afternoon')">Afternoon (2–5)</button>
                <button class="btn btn-secondary btn-sm" onclick="addPreset('evening')">Evening (5–8)</button>
              </div>
            </div>

            <button class="btn btn-primary btn-block" id="saveAvailBtn" onclick="saveAvailability()">
              <span id="saveAvailText"><i class="fa-solid fa-floppy-disk"></i> Save Day</span>
              <span id="saveAvailSpinner" class="spinner" style="display:none;"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/doctor.js"></script>
<script>
  if (!requireAuth('doctor')) {}
  else {
    populateSidebarUser();
    initMobileSidebar();
    loadMyAvailability();
  }
</script>
</body>
</html>
