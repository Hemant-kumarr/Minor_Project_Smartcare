<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Registration – SmartCare AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa-solid fa-heart-pulse"></i></div>
      <h1>SmartCare <span>AI</span></h1>
      <p>Create your patient account</p>
    </div>

    <div id="alertBox"></div>

    <form id="registerForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name <span style="color:var(--danger)">*</span></label>
          <input type="text" id="name" class="form-control" placeholder="Rahul Sharma" required />
          <span class="form-error" id="nameError"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address <span style="color:var(--danger)">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="rahul@example.com" required />
          <span class="form-error" id="emailError"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="9876543210" maxlength="10" />
          <span class="form-error" id="phoneError"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="dob">Date of Birth</label>
          <input type="date" id="dob" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Gender</label>
        <div style="display:flex;gap:16px;margin-top:4px;">
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="radio" name="gender" value="male" /> Male
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="radio" name="gender" value="female" /> Female
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="radio" name="gender" value="other" /> Other
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password <span style="color:var(--danger)">*</span></label>
          <div style="position:relative;">
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required style="padding-right:42px;" />
            <button type="button" class="toggle-pwd" data-target="password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:15px;">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password <span style="color:var(--danger)">*</span></label>
          <div style="position:relative;">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required style="padding-right:42px;" />
            <button type="button" class="toggle-pwd" data-target="confirmPassword" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:15px;">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span class="form-error" id="confirmPasswordError"></span>
        </div>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;">
          <input type="checkbox" id="terms" style="margin-top:3px;" />
          I agree to the Terms of Service and Privacy Policy
        </label>
        <span class="form-error" id="termsError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
        <span id="registerBtnText">Create Account</span>
        <span id="registerSpinner" class="spinner" style="display:none;"></span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top:16px;">
      Already have an account? <a href="/login">Sign in</a>
    </div>
    <div class="auth-footer" style="margin-top:6px;">
      Are you a doctor? <a href="/doctor-register">Register here</a>
    </div>
    <div class="auth-footer" style="margin-top:6px;">
      <a href="/" style="color:var(--gray-400);"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  if (localStorage.getItem('token')) {
    const role = localStorage.getItem('role');
    window.location.href = role === 'doctor' ? '/doctor/dashboard' : '/patient/dashboard';
  }

  // Toggle password
  document.querySelectorAll('.toggle-pwd').forEach(btn => {
    btn.addEventListener('click', function () {
      const inp = document.getElementById(this.dataset.target);
      const icon = this.querySelector('i');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      icon.className = inp.type === 'text' ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const dob = document.getElementById('dob').value;
    const gender = document.querySelector('input[name="gender"]:checked')?.value || '';
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;
    let valid = true;

    if (!name || name.length < 2) { showFieldError('nameError', 'Full name is required.'); valid = false; }
    if (!email || !/\S+@\S+\.\S+/.test(email)) { showFieldError('emailError', 'Valid email is required.'); valid = false; }
    if (phone && !/^[6-9]\d{9}$/.test(phone)) { showFieldError('phoneError', 'Enter a valid 10-digit mobile number.'); valid = false; }
    if (!password || password.length < 6) { showFieldError('passwordError', 'Password must be at least 6 characters.'); valid = false; }
    if (password !== confirmPassword) { showFieldError('confirmPasswordError', 'Passwords do not match.'); valid = false; }
    if (!terms) { showFieldError('termsError', 'You must accept the terms.'); valid = false; }
    if (!valid) return;

    setLoading(true);
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone: phone || undefined, dateOfBirth: dob || undefined, gender: gender || undefined, password })
      });
      const data = await res.json();
      if (!res.ok) { showAlert(data.message || 'Registration failed.', 'error'); return; }
      showAlert('Account created successfully! Redirecting to login…', 'success');
      setTimeout(() => window.location.href = '/login', 1800);
    } catch (err) {
      showAlert('Unable to connect to server. Please try again.', 'error');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(state) {
    const btn = document.getElementById('registerBtn');
    btn.disabled = state;
    document.getElementById('registerBtnText').textContent = state ? 'Creating account…' : 'Create Account';
    document.getElementById('registerSpinner').style.display = state ? 'inline-block' : 'none';
  }
  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
    document.getElementById('alertBox').innerHTML = '';
  }
  function showFieldError(id, msg) { document.getElementById(id).textContent = msg; }
  function showAlert(msg, type) {
    const icons = { error: 'circle-xmark', success: 'circle-check' };
    document.getElementById('alertBox').innerHTML =
      `<div class="alert alert-${type}"><i class="fa-solid fa-${icons[type]||'info'}"></i>${msg}</div>`;
  }
</script>
</body>
</html>
